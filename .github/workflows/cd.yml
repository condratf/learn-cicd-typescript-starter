name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Use gcloud CLI'
        run: 'gcloud info'

      - name: 'Build Docker image gcloud'
        run: gcloud builds submit --tag europe-southwest1-docker.pkg.dev/notely-508213/notely-ar-repo/notely:latest .

      - name: 'Run migration'
        run: npm run db:migrate

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image europe-southwest1-docker.pkg.dev/notely-508213/notely-ar-repo/notely:latest --region europe-southwest1 --allow-unauthenticated --project notely-508213 --max-instances=4